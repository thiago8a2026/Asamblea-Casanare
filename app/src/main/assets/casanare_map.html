      vectorFallbackLayer.clearLayers();
      // Fondo departamental suave sobre Casanare
      L.rectangle([[4.15, -73.25], [6.45, -69.75]], {
        color: '#94a3b8',
        weight: 1,
        dashArray: '4,6',
        fillColor: '#dbe7df',
        fillOpacity: 0.35,
        interactive: false
      }).addTo(vectorFallbackLayer);

      // Retícula geográfica real (cada 0.5 grados en Casanare)
      for (let lat = 4.5; lat <= 6.5; lat += 0.5) {
        L.polyline([[lat, -73.25], [lat, -69.75]], {
          color: '#cbd5e1', weight: 1, dashArray: '3,5', interactive: false
        }).addTo(vectorFallbackLayer);
      }
      for (let lon = -73.0; lon <= -70.0; lon += 0.5) {
        L.polyline([[4.15, lon], [6.45, lon]], {
          color: '#cbd5e1', weight: 1, dashArray: '3,5', interactive: false
        }).addTo(vectorFallbackLayer);
      }
      // Corredor Marginal de la Selva (Villanueva - Monterrey - Aguazul - Yopal - Pore - Hato Corozal)
      L.polyline([
        [4.6083, -72.9278],
        [4.8758, -72.8936],
        [5.0167, -72.7519],
        [5.1728, -72.5472],
        [5.3377, -72.3958],
        [5.6358, -72.1944],
        [5.7294, -71.9958],
        [5.8819, -71.8917],
        [6.1567, -71.7636]
      ], {
        color: '#64748b',
        weight: 2,
        opacity: 0.55,
        dashArray: '6,4',
        interactive: false
      }).addTo(vectorFallbackLayer);
    }
    drawVectorGeographicBackdrop();

    function attachTileLayer(key, idx) {
      if (activeTileLayer) {
        map.removeLayer(activeTileLayer);
      }
      const stack = tileProviders[key] || tileProviders.calles;
      const layer = stack[idx] || stack[0];
      tileErrorsCount = 0;
      layer.off('tileerror');
      layer.off('tileload');
      layer.on('tileload', () => {
        document.getElementById('tileStatusBadge').style.display = 'none';
      });
      layer.on('tileerror', () => {
        tileErrorsCount++;
        if (tileErrorsCount >= 3) {
          if (idx + 1 < stack.length) {
            currentProviderIdx = idx + 1;
            attachTileLayer(key, currentProviderIdx);
          } else {
            document.getElementById('tileStatusBadge').style.display = 'block';
          }
        }
      });
      layer.addTo(map);
      activeTileLayer = layer;
    }

    attachTileLayer('calles', 0);

    let casanareGeoJson = FALLBACK_CASANARE_GEOJSON;
    let muniLayer = null;
    let muniLabelLayer = L.layerGroup().addTo(map);
    let veredaLayer = L.layerGroup().addTo(map);
    let leadersLayer = L.layerGroup().addTo(map);

    let currentState = {
      selectedMunicipioId: null,
      selectedVeredaId: null,
      isCampaignMode: false,
      activeLayer: 'CALOR_ELECTORAL',
      showLeaderPins: true,
      veredaFilter: 'TODAS',
      primaryColor: '#0B6E4F',
      secondaryColor: '#D97706',
      municipios: [],
      veredas: []
    };

    const SUBREGION_COLORS = {
      'Centro': '#0B6E4F',
      'Piedemonte': '#059669',
      'Sur': '#15803D',
      'Norte': '#0E7490',
      'Oriente': '#D97706',
      'Cordillera': '#4D7C0F'
    };

    function forceMapResize() {
      map.invalidateSize({ animate: false });
    }

    function setBasemap(key) {
      if (!tileProviders[key] || key === currentBaseKey) return;
      currentBaseKey = key;
      currentProviderIdx = 0;
      attachTileLayer(key, 0);
    }

    function zoomIn() { map.zoomIn(); }
    function zoomOut() { map.zoomOut(); }
    function resetView() {
      forceMapResize();
      if (muniLayer && !currentState.selectedMunicipioId) {
        map.fitBounds(muniLayer.getBounds(), { padding: [18, 18] });
      } else if (muniLayer && currentState.selectedMunicipioId) {
        muniLayer.eachLayer(l => {
          if (String(l.feature.id) === String(currentState.selectedMunicipioId)) {
            map.fitBounds(l.getBounds(), { padding: [24, 24] });
          }
        });
      } else {
        map.setView([5.3378, -72.3959], 8);
      }
    }

    function getMuniMeta(codigoDane) {
      return currentState.municipios.find(m => m.codigoDane === String(codigoDane)) || null;
    }

    function computeTemperatureScore(m) {
      if (!m) return 0;
      const pctReal = m.metaVotos > 0 ? (m.simpatizantesCount * 100 / m.metaVotos) : 0;
      return Math.min(100, Math.max(pctReal, m.nivelEnergia + (m.simpatizantesCount * 4)));
    }

    function heatColor(pct) {
      if (pct <= 15) return '#9CA3AF';
      if (pct < 42) return '#EF4444';
      if (pct < 72) return '#F59E0B';
      if (pct < 90) return '#10B981';
      return '#0284C7';
    }

    function energyColor(energia, isOrphan) {
      if (isOrphan || energia < 40) return '#DC2626';
      if (energia < 65) return '#F97316';
      return '#16A34A';
    }

    function styleMunicipio(feature) {
      const code = String(feature.id);
      const m = getMuniMeta(code);
      const isSelected = currentState.selectedMunicipioId === code;
      const inDetailMode = currentState.selectedMunicipioId != null;

      let fill = currentState.primaryColor;
      if (!currentState.isCampaignMode) {
        fill = m ? (SUBREGION_COLORS[m.subregion] || currentState.primaryColor) : currentState.primaryColor;
      } else if (m) {
        if (currentState.activeLayer === 'CALOR_ELECTORAL') {
          fill = heatColor(computeTemperatureScore(m));
        } else if (currentState.activeLayer === 'ENERGIA_ALERTAS') {
          fill = energyColor(m.nivelEnergia, false);
        } else {
          fill = m.lideresCount > 0 ? '#059669' : '#DC2626';
        }
      }

      if (inDetailMode && !isSelected) {
        return {
          color: '#475569',
          weight: 1.2,
          fillColor: '#94A3B8',
          fillOpacity: 0.16
        };
      }

      return {
        color: isSelected ? '#0F172A' : '#FFFFFF',
        weight: isSelected ? 3.2 : 2,
        fillColor: fill,
        fillOpacity: isSelected ? 0.26 : (currentState.isCampaignMode ? 0.65 : 0.48)
      };
    }

    function buildMunicipioTooltip(feature) {
      const code = String(feature.id);
      const m = getMuniMeta(code);
      const name = m ? m.nombre : (feature.properties?.name || code);
      if (!m) return `<b>${name}</b>`;

      if (!currentState.isCampaignMode) {
        return `<b>${name}</b> <span style="opacity:.85">(${m.subregion})</span><br/>Toca para ver gestión y propuestas`;
      }
      const temp = Math.round(computeTemperatureScore(m));
      return `<b>${name}</b> · Fuerza ${temp}%<br/>Simpatizantes: ${m.simpatizantesCount}/${m.metaVotos} · Líderes: ${m.lideresCount} · Energía: ${m.nivelEnergia}%`;
    }

    function renderMunicipiosLayer(fitDept) {
      if (!casanareGeoJson || !casanareGeoJson.features) return;
      if (muniLayer) map.removeLayer(muniLayer);
      muniLabelLayer.clearLayers();
      leadersLayer.clearLayers();

      muniLayer = L.geoJSON(casanareGeoJson, {
        style: styleMunicipio,
        onEachFeature: (feature, layer) => {
          const code = String(feature.id);
          const m = getMuniMeta(code);
          const name = m ? m.nombre : (feature.properties?.name || code);

          layer.bindTooltip(buildMunicipioTooltip(feature), {
            sticky: true,
            className: 'casanare-tip'
          });
          layer.on('click', () => {
            if (window.AndroidBridge && window.AndroidBridge.onMunicipioSelected) {
              window.AndroidBridge.onMunicipioSelected(code);
            }
          });

          const center = layer.getBounds().getCenter();
          if (!currentState.selectedMunicipioId) {
            if (!(currentState.isCampaignMode && currentState.showLeaderPins)) {
              L.tooltip({
                permanent: true,
                direction: 'center',
                className: 'muni-label'
              })
              .setContent(name)
              .setLatLng(center)
              .addTo(muniLabelLayer);
            }
          }
        }
      }).addTo(map);

      // Marcadores interactivos de líderes en Nivel 1
      if (!currentState.selectedMunicipioId && currentState.isCampaignMode && currentState.showLeaderPins) {
        currentState.municipios.forEach(m => {
          const munVeredas = currentState.veredas.filter(v => v.municipioId === m.codigoDane);
          const leadVereda = munVeredas.find(v => v.liderUid) || munVeredas[0];
          if (!leadVereda || !leadVereda.lat || !leadVereda.lon) return;

          const activeCount = munVeredas.filter(v => v.liderUid).length;
          const shortLeader = leadVereda.liderNombre ? leadVereda.liderNombre.split(' ')[0] : 'Sin líder';
          const icon = L.divIcon({
            className: '',
            html: `<div class="leader-pin-card ${activeCount === 0 ? 'orphan' : ''}"><span>${m.nombre}: ${shortLeader}</span><span class="leader-pin-count">${m.simpatizantesCount}</span></div>`,
            iconSize: null
          });
          const mk = L.marker([leadVereda.lat, leadVereda.lon], { icon }).addTo(leadersLayer);
          mk.on('click', () => {
            if (window.AndroidBridge && window.AndroidBridge.onLeaderPinClicked) {
              window.AndroidBridge.onLeaderPinClicked(leadVereda.id);
            }
          });
        });
      }

      if (currentState.selectedMunicipioId) {
        muniLayer.eachLayer(l => {
          if (String(l.feature.id) === String(currentState.selectedMunicipioId)) {
            map.fitBounds(l.getBounds(), { padding: [24, 24], animate: true });
          }
        });
      } else if (fitDept) {
        map.fitBounds(muniLayer.getBounds(), { padding: [16, 16], animate: false });
      }
    }

    function renderVeredasLayer() {
      veredaLayer.clearLayers();
      const muniId = currentState.selectedMunicipioId;
      if (!muniId) return;

      let list = currentState.veredas.filter(v => v.municipioId === muniId);
      if (currentState.isCampaignMode) {
        if (currentState.veredaFilter === 'HUERFANAS') {
          list = list.filter(v => !v.liderUid);
        } else if (currentState.veredaFilter === 'ALERTA_BAJA') {
          list = list.filter(v => v.nivelEnergia < 45);
        }
      }

      list.forEach(v => {
        const isOrphan = !v.liderUid;
        const pct = Math.min(100, Math.max(v.metaVotos > 0 ? (v.simpatizantesCount * 100 / v.metaVotos) : 0, v.nivelEnergia + (v.simpatizantesCount * 6)));
        let color = v.zona === 'URBANA' ? currentState.secondaryColor : currentState.primaryColor;
        if (currentState.isCampaignMode) {
          if (currentState.activeLayer === 'CALOR_ELECTORAL') color = heatColor(pct);
          else if (currentState.activeLayer === 'ENERGIA_ALERTAS') color = energyColor(v.nivelEnergia, isOrphan);
          else color = isOrphan ? '#DC2626' : '#16A34A';
        }
        const isSelected = currentState.selectedVeredaId === v.id;

        if (v.geojson && v.geojson.trim().startsWith('{')) {
          try {
            const parsed = JSON.parse(v.geojson);
            const poly = L.geoJSON(parsed, {
              style: {
                color: isSelected ? '#0F172A' : '#FFFFFF',
                weight: isSelected ? 3 : 2,
                fillColor: color,
                fillOpacity: isSelected ? 0.72 : 0.56
              }
            }).addTo(veredaLayer);
            poly.bindTooltip(`<b>${v.nombre}</b> (${v.zona})`, { sticky: true, className: 'casanare-tip' });
            poly.on('click', () => {
              if (window.AndroidBridge && window.AndroidBridge.onVeredaSelected) {
                window.AndroidBridge.onVeredaSelected(v.id);
              }
            });
          } catch (e) {}
        }

        if (v.lat && v.lon) {
          const marker = L.circleMarker([v.lat, v.lon], {
            radius: isSelected ? 12 : (v.zona === 'URBANA' ? 10 : 8.5),
            color: isSelected ? '#0F172A' : '#FFFFFF',
            weight: isSelected ? 3 : 2,
            fillColor: color,
            fillOpacity: 0.95
          }).addTo(veredaLayer);

          marker.bindTooltip(v.nombre, {
            permanent: true,
            direction: 'right',
            offset: [10, 0],
            className: 'vereda-label'
          });
          marker.on('click', () => {
            if (window.AndroidBridge && window.AndroidBridge.onVeredaSelected) {
              window.AndroidBridge.onVeredaSelected(v.id);
            }
          });

          if (currentState.isCampaignMode && currentState.showLeaderPins) {
            const leaderText = isOrphan ? 'Sin líder' : v.liderNombre.split(' ')[0];
            const pinIcon = L.divIcon({
              className: '',
              html: `<div class="leader-pin-card ${isOrphan ? 'orphan' : ''}"><span>${leaderText}</span><span class="leader-pin-count">${v.simpatizantesCount}</span></div>`,
              iconSize: null,
              iconAnchor: [0, -14]
            });
            const lMarker = L.marker([v.lat, v.lon], { icon: pinIcon }).addTo(leadersLayer);
            lMarker.on('click', () => {
              if (window.AndroidBridge && window.AndroidBridge.onLeaderPinClicked) {
                window.AndroidBridge.onLeaderPinClicked(v.id);
              }
            });
          }
        }
      });
    }

    window.initCasanareGeoJson = function(geoJsonObj) {
      if (geoJsonObj && geoJsonObj.features && geoJsonObj.features.length > 0) {
        casanareGeoJson = geoJsonObj;
      }
      forceMapResize();
      renderMunicipiosLayer(true);
      renderVeredasLayer();
    };

    window.updateMapState = function(newState) {
      const prevMuni = currentState.selectedMunicipioId;
      currentState = Object.assign({}, currentState, newState);
      const muniChanged = prevMuni !== currentState.selectedMunicipioId;
      forceMapResize();
      renderMunicipiosLayer(muniChanged && !currentState.selectedMunicipioId);
      renderVeredasLayer();
    };

    function bootMap() {
      forceMapResize();
      renderMunicipiosLayer(true);
      setTimeout(() => {
        forceMapResize();
        if (muniLayer && !currentState.selectedMunicipioId) {
          map.fitBounds(muniLayer.getBounds(), { padding: [16, 16], animate: false });
        }
      }, 300);
      setTimeout(forceMapResize, 800);
    }

    document.addEventListener('DOMContentLoaded', bootMap);
    window.addEventListener('resize', forceMapResize);
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(() => forceMapResize()).observe(document.getElementById('map'));
    }
    bootMap();
  </script>
</body>
</html>
